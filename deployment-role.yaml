AWSTemplateFormatVersion: '2010-09-09'
Description: Shared deployment role for GitHub-based infrastructure deployment

Resources:
  GitHubInfrastructureDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GitHubInfrastructureDeploymentRole

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - cloudformation.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: ABCInfrastructureDeploymentPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:*
                  - ecs:*
                  - s3:*
                  - states:*
                  - events:*
                  - logs:*
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: '*'

              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:CreateServiceLinkedRole
                Resource: '*'

              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: '*'
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - ec2.amazonaws.com
                      - ecs-tasks.amazonaws.com
                      - states.amazonaws.com
                      - events.amazonaws.com
